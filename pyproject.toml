[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmic-synapse-a-lmi"
version = "1.0.0"
description = "Preserved and modernized COSMIC SYNAPSE / A-LMI research software by Cory Shane Davis"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Cory Shane Davis"},
]
keywords = [
  "cosmic-synapse",
  "a-lmi",
  "adaptive-state",
  "multimodal-memory",
  "research-software",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "cryptography>=41.0",
]

[project.optional-dependencies]
audio = [
  "soundfile>=0.12",
  "librosa>=0.10",
  "vosk>=0.3.45",
  "PyAudio>=0.2.13",
]
ml = [
  "torch>=2.0",
  "transformers>=4.30",
  "Pillow>=10.0",
  "soundfile>=0.12",
]
infra = [
  "kafka-python>=2.0.2",
  "minio>=7.2",
  "pymilvus>=2.3",
  "neo4j>=5.14",
  "scrapy>=2.11",
]
viz = [
  "plotly>=5.17",
  "dash>=2.14",
  "dash-cytoscape>=0.3",
  "matplotlib>=3.7",
]
ipc = [
  "websockets>=12.0",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "build>=1.2",
  "ruff>=0.6",
]

[project.scripts]
cosmic-synapse = "a_lmi.cli:main"

[project.urls]
Repository = "https://github.com/NavisWORLD/cosmic-synapse-A-lmi-v.2"

[tool.setuptools.packages.find]
where = ["."]
include = ["a_lmi*", "cosmic_synapse*", "interfaces*"]
exclude = ["tests*", "experiments*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "cosmic_synapse/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
