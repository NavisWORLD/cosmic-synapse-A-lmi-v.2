plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'world.navis.lighttoken'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.9'
    modules = ['javafx.controls']
}

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
}

dependencyLocking {
    lockAllConfigurations()
}

application {
    mainClass = 'world.navis.lighttoken.LightTokenWorkstation'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'lighttoken.native.dir', System.getProperty('lighttoken.native.dir', '')
    systemProperty 'lighttoken.fixture.dir', System.getProperty('lighttoken.fixture.dir', '')
}
