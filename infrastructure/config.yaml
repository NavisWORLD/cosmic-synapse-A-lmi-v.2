# Active A-LMI / Cosmic Synapse configuration.
# Historical configuration values remain recoverable from Git history and the
# preservation branch. Secrets are intentionally supplied through environment
# variables; see .env.example.

infrastructure:
  kafka:
    bootstrap_servers: "localhost:9092"
    topics:
      - "web_crawler"
      - "audio_processing"
      - "light_tokens"
      - "reasoning"
      - "cosmic_synapse"

  minio:
    endpoint: "localhost:9000"
    access_key: "${A_LMI_MINIO_ACCESS_KEY:-}"
    secret_key: "${A_LMI_MINIO_SECRET_KEY:-}"
    bucket: "a-lmi-data-v2"
    secure: false

  milvus:
    host: "localhost"
    port: 19530
    # v2 avoids silently reusing the legacy schema whose spectral vector size
    # conflicts with both the historical full FFT and the modern real rFFT.
    collection_name: "light_tokens_v2"
    metric_type: "L2"
    index_type: "IVF_FLAT"
    index_params:
      nlist: 1024

  neo4j:
    uri: "bolt://localhost:7687"
    username: "${A_LMI_NEO4J_USERNAME:-neo4j}"
    password: "${A_LMI_NEO4J_PASSWORD:-}"
    database: "neo4j"

a_lmi:
  data_structures:
    embedding_dimension: 1536
    spectral_signature_size: 769  # np.fft.rfft(1536) => 1536/2 + 1 bins
    spectral_transform: "embedding_rfft"

  perception:
    web_crawler:
      max_pages_per_domain: 1000
      delay_between_requests: 1.0
      respect_robots_txt: true

    audio_processor:
      sample_rate: 44100
      chunk_size: 4096
      format: "paInt16"
      channels: 1

    speech_to_text:
      model_path: "models/vosk-model-en-us-0.22"
      sample_rate: 16000

  urgent:
    # Historical CST constants retained for software compatibility. Their use
    # in simulation is not a claim of new physical law.
    golden_ratio: 1.61803398875
    speed_of_light: 299792458.0
    lyapunov_base: 0.9056

  memory:
    temporal_kg:
      enable_temporal_modeling: true
      default_timestamp_property: "timestamp"

    vector_db:
      metric_type: "L2"
      index_type: "IVF_FLAT"
      index_params:
        nlist: 1024

cosmic_synapse:
  physics:
    timestep: 0.01
    max_particles: 1000
    alpha_phi: 1.0
    beta: 0.5
    gamma: 0.3
    kappa_omega: 0.2
    zeta: 0.05
    sigma_lambda_base: 0.1
    sigma_psd_scale: 0.5

  audio:
    enable_live_audio: true
    sample_rate: 44100
    fft_size: 4096
    normalization_range: [0.0, 1.0]

  rendering:
    frame_rate: 60
    enable_3d: false
    background_color: [0.0, 0.0, 0.0, 1.0]

security:
  encryption:
    algorithm: "AES-256-GCM"
    key_size: 32

  key_management:
    kms_type: "local"
    key_storage_path: "keys/"

  privacy:
    enable_homomorphic_encryption: false
    enable_federated_learning: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/a_lmi.log"
