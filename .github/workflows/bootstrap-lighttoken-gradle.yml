name: Bootstrap LightToken Gradle Wrapper

on:
  push:
    branches:
      - feature/lighttoken-native-workstation-001

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lighttoken-native-workstation-001
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Generate locked wrapper files
        run: |
          gradle -p apps/lighttoken-workstation-java dependencies --write-locks
          gradle -p apps/lighttoken-workstation-java wrapper --gradle-version 8.14.5 --distribution-type bin
      - name: Commit generated wrapper only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/lighttoken-workstation-java/gradle.lockfile \
            apps/lighttoken-workstation-java/gradlew \
            apps/lighttoken-workstation-java/gradlew.bat \
            apps/lighttoken-workstation-java/gradle/wrapper/gradle-wrapper.jar \
            apps/lighttoken-workstation-java/gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Wrapper already committed."
          else
            git commit -m "build(lighttoken): commit pinned Gradle wrapper"
            git push origin HEAD:feature/lighttoken-native-workstation-001
          fi
