name: Native Lockfile Temp

on:
  push:
    branches:
      - native/almi-core-rust-001
    paths:
      - .github/workflows/native-lockfile-temp.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native/almi-core-rust-001
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        working-directory: native/almi-core-rs
        run: cargo generate-lockfile
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/almi-core-rs/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git commit -m "build(native): refresh Cargo.lock for PyO3 0.29.2"
          git push origin HEAD:native/almi-core-rust-001
