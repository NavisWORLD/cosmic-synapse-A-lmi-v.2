name: Native Lockfile Temp

on:
  push:
    branches:
      - native/almi-core-rust-001
    paths:
      - .github/workflows/native-lockfile-temp.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        working-directory: native/almi-core-rs
        run: cargo generate-lockfile
      - name: Upload Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: almi-native-cargo-lock
          path: native/almi-core-rs/Cargo.lock
          if-no-files-found: error
