name: Restoration CI

on:
  push:
    branches:
      - main
      - restoration/complete-system-2026-09-14
      - integration/vm-gates-2026-09-15
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deterministic test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest pytest-cov numpy scipy pyyaml cryptography
      - name: Compile active Python sources
        run: python -m compileall -q a_lmi cosmic_synapse coms/hrcs/src/hrcs interfaces
      - name: Run deterministic restoration contracts
        env:
          PYTHONPATH: .:coms/hrcs/src
        run: >-
          python -m pytest -q
          tests/test_config_contract.py
          tests/test_light_token_contract.py
          tests/test_password_encryption.py
          tests/test_object_storage_contract.py
          tests/test_artifact_persistence.py
          tests/test_multimodal_contract.py
          tests/test_embedding_spaces.py
          tests/test_vector_schema_contract.py
          tests/test_memory_schema.py
          tests/test_tkg_contract.py
          tests/test_tkg_visualization.py
          tests/test_audio_optional_contract.py
          tests/test_optional_audio.py
          tests/test_cst_state.py
          tests/test_cst_replay.py
          tests/test_hypothesis_provenance.py
          tests/test_federated_claims.py
          tests/test_packaging_contract.py
          tests/test_compose_contract.py
          tests/test_continuity_bundle.py
          tests/test_provider_runtime.py
          tests/test_cli_product_flow.py
          tests/test_benchmarking.py
          tests/test_security_active_surface.py
          coms/hrcs/tests/test_packet_protocol_v2.py
          coms/hrcs/tests/test_acoustic_roundtrip.py
          coms/hrcs/tests/test_mesh_replay.py
          coms/hrcs/tests/test_simulated_e2e.py
          coms/hrcs/tests/test_radio_contract.py
          cosmic_synapse/tests/test_ipc_schema.py
          cosmic_synapse/tests/test_ipc_bridge_contract.py
          cosmic_synapse/tests/test_unity_ipc_source_contract.py

  security-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install security test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run active-surface security regression gate
        run: python -m pytest -q tests/test_security_active_surface.py

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade pip build && python -m build
      - name: Install built wheel into a clean environment
        run: |
          python -m venv .clean-venv
          . .clean-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          cosmic-synapse doctor --json > /tmp/cosmic-doctor.json
          cat /tmp/cosmic-doctor.json
          grep -q '"core_imports": "ok"' /tmp/cosmic-doctor.json
          python -c "from a_lmi.core.light_token import LightToken; from cosmic_synapse.cst_state import CSTEngine; print(CSTEngine(seed=1).state.snapshot())"
      - name: Smoke portable product flow from installed wheel
        run: |
          . .clean-venv/bin/activate
          tmpdir="$(mktemp -d)"
          cosmic-synapse --help > /tmp/cosmic-help.txt
          cosmic-synapse init "$tmpdir/source" --name "CI Portable Cosmos" --seed 7 --json > /tmp/cosmic-init.json
          cosmic-synapse inspect "$tmpdir/source" --json > /tmp/cosmic-inspect-source.json
          cosmic-synapse export "$tmpdir/source" "$tmpdir/state.cosmos" --json > /tmp/cosmic-export.json
          cosmic-synapse verify "$tmpdir/state.cosmos" --json > /tmp/cosmic-verify.json
          cosmic-synapse import "$tmpdir/state.cosmos" "$tmpdir/restored" --json > /tmp/cosmic-import.json
          cosmic-synapse inspect "$tmpdir/restored" --json > /tmp/cosmic-inspect-restored.json
          cosmic-synapse providers --json > /tmp/cosmic-providers.json
          grep -q '"valid": true' /tmp/cosmic-verify.json
          grep -q '"name": "CI Portable Cosmos"' /tmp/cosmic-inspect-restored.json
          grep -q '"tool_authority": \[\]' /tmp/cosmic-inspect-restored.json
          grep -q '"network_checked": false' /tmp/cosmic-providers.json

  god-music:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: god music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install God Music dependencies
        run: npm install --no-audit --no-fund
      - name: Run God Music deterministic tests
        run: npm test
      - name: Build God Music web application
        run: npm run build

  minio-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MinIO integration dependencies
        run: python -m pip install . 'minio>=7.2'
      - name: Run live MinIO write-restart-read gate
        run: bash integration/vm/run_minio_gate.sh

  kafka-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kafka integration dependencies
        run: python -m pip install . 'kafka-python==2.0.2'
      - name: Run live Kafka produce-restart-consume gate
        run: bash integration/vm/run_kafka_gate.sh

  neo4j-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Neo4j integration dependencies
        run: python -m pip install . 'neo4j>=5.14,<6'
      - name: Run live Neo4j write-restart-read gate
        run: bash integration/vm/run_neo4j_gate.sh

  milvus-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Milvus integration dependencies
        run: python -m pip install . 'pymilvus>=2.3,<2.4'
      - name: Run live Milvus insert-search-restart-search gate
        run: bash integration/vm/run_milvus_gate.sh
