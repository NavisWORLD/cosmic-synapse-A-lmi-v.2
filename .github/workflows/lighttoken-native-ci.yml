name: LightToken Native CI

on:
  push:
    branches:
      - feature/lighttoken-native-workstation-001
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: lighttoken-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python reference
        run: python -m pip install -e . pytest
      - name: Verify preserved Python LightToken oracle
        run: python -m pytest -q tests/test_light_token_contract.py
      - name: Verify deterministic fixture generator
        run: |
          python scripts/generate_lighttoken_fixtures.py --output "$RUNNER_TEMP/lighttoken-a"
          python scripts/generate_lighttoken_fixtures.py --output "$RUNNER_TEMP/lighttoken-b"
          diff -r "$RUNNER_TEMP/lighttoken-a" "$RUNNER_TEMP/lighttoken-b"

  native-interop-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python reference
        run: python -m pip install -e . pytest
      - name: Native interoperability contract must remain RED until CLI exists
        env:
          LIGHTTOKEN_NATIVE_CLI: ${{ github.workspace }}/native/lighttoken-rs/target/debug/lighttoken
        run: python -m pytest -q tests/test_lighttoken_native_interop.py
