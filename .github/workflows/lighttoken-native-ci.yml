name: LightToken Native CI

on:
  push:
    branches:
      - feature/lighttoken-native-workstation-001
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: lighttoken-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python reference
        run: python -m pip install -e . pytest
      - name: Verify preserved Python LightToken oracle
        run: python -m pytest -q tests/test_light_token_contract.py
      - name: Verify deterministic fixture generator
        run: |
          python scripts/generate_lighttoken_fixtures.py --output "$RUNNER_TEMP/lighttoken-a"
          python scripts/generate_lighttoken_fixtures.py --output "$RUNNER_TEMP/lighttoken-b"
          diff -r "$RUNNER_TEMP/lighttoken-a" "$RUNNER_TEMP/lighttoken-b"

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python reference
        run: python -m pip install -e .
      - name: Generate synthetic oracle fixtures
        run: python scripts/generate_lighttoken_fixtures.py --output tests/fixtures/lighttoken
      - name: Rust format
        run: cargo fmt --manifest-path native/lighttoken-rs/Cargo.toml --all -- --check
      - name: Rust core Clippy
        run: cargo clippy --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-core --all-targets -- -D warnings
      - name: Rust core tests
        run: cargo test --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-core

  rust-spectrum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python reference
        run: python -m pip install -e .
      - name: Generate synthetic oracle fixtures
        run: python scripts/generate_lighttoken_fixtures.py --output tests/fixtures/lighttoken
      - name: Spectrum Clippy
        run: cargo clippy --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-spectrum --all-targets -- -D warnings
      - name: Verify Python-Rust spectral parity
        run: cargo test --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-spectrum

  rust-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python reference
        run: python -m pip install -e .
      - name: Generate synthetic oracle fixtures
        run: python scripts/generate_lighttoken_fixtures.py --output tests/fixtures/lighttoken
      - name: Data Clippy
        run: cargo clippy --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-index -p lighttoken-io --all-targets -- -D warnings
      - name: Verify deterministic search and safe IO
        run: cargo test --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-index -p lighttoken-io

  rust-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python reference
        run: python -m pip install -e . pytest
      - name: CLI Clippy
        run: cargo clippy --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-cli --all-targets -- -D warnings
      - name: CLI parser and command tests
        run: cargo test --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-cli
      - name: Build native CLI
        run: cargo build --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-cli
      - name: Verify Python-Rust CLI interoperability
        env:
          LIGHTTOKEN_NATIVE_CLI: ${{ github.workspace }}/native/lighttoken-rs/target/debug/lighttoken
        run: python -m pytest -q tests/test_lighttoken_native_interop.py

  rust-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python reference
        run: python -m pip install -e .
      - name: Generate synthetic oracle fixtures
        run: python scripts/generate_lighttoken_fixtures.py --output tests/fixtures/lighttoken
      - name: FFI Clippy
        run: cargo clippy --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-ffi --all-targets -- -D warnings
      - name: FFI lifecycle tests
        run: cargo test --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-ffi
      - name: Build C/JNI library
        run: cargo build --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-ffi
      - name: External C ABI smoke
        run: |
          cc native/lighttoken-rs/tests/c_abi_smoke.c \
            -I native/lighttoken-rs/include \
            -L native/lighttoken-rs/target/debug \
            -Wl,-rpath,${{ github.workspace }}/native/lighttoken-rs/target/debug \
            -llighttoken_ffi \
            -o "$RUNNER_TEMP/lighttoken-c-smoke"
          "$RUNNER_TEMP/lighttoken-c-smoke" tests/fixtures/lighttoken/active_random.json


  cpp-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Configure scalar C++ accelerator
        run: cmake -S native/lighttoken-cpp -B native/lighttoken-cpp/build -DCMAKE_BUILD_TYPE=Release
      - name: Build scalar C++ accelerator
        run: cmake --build native/lighttoken-cpp/build --config Release
      - name: Run C++ known-vector self-tests
        run: ctest --test-dir native/lighttoken-cpp/build --output-on-failure
      - name: Verify explicit Rust fallback
        run: cargo test --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-spectrum --test cpp_fallback
      - name: Verify C++ and Rust score parity
        env:
          LIGHTTOKEN_CPP_LIB: ${{ github.workspace }}/native/lighttoken-cpp/build/liblighttoken_accel.so
        run: cargo test --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-spectrum --test cpp_parity -- --nocapture
      - name: C++ backend Rust Clippy
        run: cargo clippy --manifest-path native/lighttoken-rs/Cargo.toml -p lighttoken-spectrum --all-targets -- -D warnings
